<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro — Polaris</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: #0d1b2a;
            color: #f8f9fa;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #1b263b 0%, #415a77 100%);
            border-bottom: 2px solid #778da9;
        }
        .navbar-brand { font-size: 1.6rem; font-weight: 700; color: #fff; white-space: nowrap; }

        /* nav links */
        .nav-link-custom {
            color: #adb5bd;
            text-decoration: none;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }
        .nav-link-custom:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .nav-link-custom.active { background: rgba(119,141,169,0.25); color: #e2e8f0; }

        @media (max-width: 991px) {
            .navbar-brand { font-size: 1.15rem; }
            .nav-link-custom { padding: 0.3rem 0.5rem; font-size: 0.82rem; }
        }
        @media (max-width: 575px) {
            .navbar-brand { font-size: 1rem; }
            .nav-link-custom { padding: 0.3rem 0.4rem; }
            .nav-link-custom .nav-label { display: none; }
            .nav-link-custom i.bi { margin-right: 0 !important; font-size: 1rem; }
            .navbar .dropdown > .btn {
                font-size: 0.78rem;
                padding: 0.2rem 0.45rem;
                max-width: 120px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
        }

        .card {
            background: #1b263b;
            border: 2px solid #415a77;
        }

        .card-header {
            background: #415a77;
            border-bottom: 2px solid #778da9;
            font-weight: 600;
            color: #ffffff;
            font-size: 0.95rem;
        }

        .price-box {
            background: #0d1b2a;
            border: 2px solid #415a77;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: #f8f9fa;
            width: 100%;
            min-width: 0;
        }

        .price-box * {
            color: #f8f9fa !important;
        }

        .box-label {
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .box-sub {
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1.2;
            opacity: 0.9;
        }

        .price-box .fw-bold {
            font-size: 1.15rem;
            line-height: 1.1;
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar mb-4">
        <div class="container-fluid px-2 px-lg-3">
            <div class="d-flex align-items-center justify-content-between w-100">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <a href="/" class="d-inline-flex align-items-center text-decoration-none" aria-label="Polaris">
                        <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="34" height="34" style="border-radius:8px;">
                    </a>
                    <span class="navbar-brand">Polaris</span>
                    <button type="button" class="build-badge-btn"
                            onclick="openReleaseNotes()"
                            title="Cosa c'è di nuovo — release del {{ build_info.date }}">
                        {{ build_info.label }}
                    </button>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <a href="/" class="nav-link-custom"><i class="bi bi-graph-up me-1"></i><span class="nav-label">Gamma</span></a>
                    <a href="/macro" class="nav-link-custom active"><i class="bi bi-globe2 me-1"></i><span class="nav-label">Macro</span></a>
                    <a href="/checklist" class="nav-link-custom"><i class="bi bi-check2-square me-1"></i><span class="nav-label">Checklist</span></a>
                    <a href="/stocks" class="nav-link-custom"><i class="bi bi-bank me-1"></i><span class="nav-label">Stocks</span></a>
                    <a href="/screener" class="nav-link-custom"><i class="bi bi-funnel me-1"></i><span class="nav-label">Screener</span></a>
                    <a href="/portfolio" class="nav-link-custom"><i class="bi bi-briefcase me-1"></i><span class="nav-label">Portafoglio</span></a>

                    {% set user = session.get('user') %}
                    {% if user %}
                        <div class="dropdown ms-2">
                            <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                {{ user.get('name') or user.get('email') or 'Account' }}
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" style="background:#1b263b;border:2px solid #415a77;">
                                {% if user.get('email') %}
                                    <li><span class="dropdown-item-text" style="color:#adb5bd;">{{ user.get('email') }}</span></li>
                                    <li><hr class="dropdown-divider" style="border-color:#415a77;"></li>
                                {% endif %}
                                <li><a class="dropdown-item" href="/admin" style="color:#f8f9fa;">Admin</a></li>
                                <li><hr class="dropdown-divider" style="border-color:#415a77;"></li>
                                <li><a class="dropdown-item" href="/logout" style="color:#f8f9fa;">Logout</a></li>
                            </ul>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-2 px-lg-3">
        <!-- COT cards (S&P 500 / NASDAQ-100 / Euro FX), generate da COT_CONTRACTS -->
        <div class="row g-2 mb-4" id="cotRow"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ---- COT (Non-Commercial) — CFTC Legacy Futures Only ----
        // Un box per contratto; markup, fetch e render sono generici sul prefix.
        const COT_CONTRACTS = [
            { symbol: 'sp500',     prefix: 'cotSp500', title: 'COT S&amp;P 500',    ticker: 'ES' },
            { symbol: 'nasdaq100', prefix: 'cotNq',    title: 'COT NASDAQ-100',     ticker: 'NQ' },
            { symbol: 'eurofx',    prefix: 'cotEur',   title: 'COT Euro FX',        ticker: '6E' },
            { symbol: 'gold',      prefix: 'cotGold',  title: 'COT Oro',            ticker: 'GC' },
            { symbol: 'bitcoin',   prefix: 'cotBtc',   title: 'COT Bitcoin',        ticker: 'BTC' },
        ];

        let cotPollIntervalId = null;

        function cotCardHtml(c) {
            const p = c.prefix;
            return `
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card" id="${p}Card">
                    <div class="card-header">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <i class="bi bi-people me-2"></i>${c.title} <span class="text-muted small">(${c.ticker})</span> <span class="text-muted small" id="${p}ReportDate"></span>
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-light" id="${p}RefreshBtn" aria-label="Refresh COT ${c.ticker}" title="Refresh">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="text-muted small mb-2">Non-Commercial (Large Speculators) — CFTC Legacy</div>

                        <div id="${p}Bias" class="alert mb-2 py-2 px-2" style="display:none; font-size: 0.85rem;"></div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <div class="price-box text-start">
                                    <div class="box-label">NC Long</div>
                                    <div class="fw-bold text-success" id="${p}NcLong">--</div>
                                    <div class="box-sub" id="${p}NcLongChange">--</div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="price-box text-start">
                                    <div class="box-label">NC Short</div>
                                    <div class="fw-bold text-danger" id="${p}NcShort">--</div>
                                    <div class="box-sub" id="${p}NcShortChange">--</div>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-12">
                                <div class="price-box text-start">
                                    <div class="box-label">NC Net (Long − Short)</div>
                                    <div class="fw-bold" id="${p}NcNet">--</div>
                                    <div class="box-sub" id="${p}NcNetChange">--</div>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <div class="price-box text-start">
                                    <div class="box-label">% OI Long</div>
                                    <div class="fw-bold" id="${p}NcPctLong">--</div>
                                    <div class="box-sub" id="${p}NcTradersLong">-- traders</div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="price-box text-start">
                                    <div class="box-label">% OI Short</div>
                                    <div class="fw-bold" id="${p}NcPctShort">--</div>
                                    <div class="box-sub" id="${p}NcTradersShort">-- traders</div>
                                </div>
                            </div>
                        </div>

                        <div class="text-muted small mb-1">Net history (last weeks)</div>
                        <div class="table-responsive">
                            <table class="table table-sm table-dark table-borderless mb-0" style="font-size: 0.78rem;">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th class="text-end">Net</th>
                                        <th class="text-end">Δ</th>
                                    </tr>
                                </thead>
                                <tbody id="${p}NcHistoryBody">
                                    <tr><td colspan="3" class="text-center text-muted py-2">Loading…</td></tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="text-muted small mt-2" id="${p}Footer">--</div>
                    </div>
                </div>
            </div>`;
        }

        function fmtCotInt(n) {
            const v = Number(n);
            if (!Number.isFinite(v)) return '--';
            return v.toLocaleString('en-US');
        }

        function fmtCotSigned(n) {
            const v = Number(n);
            if (!Number.isFinite(v)) return '--';
            const sign = v > 0 ? '+' : '';
            return sign + v.toLocaleString('en-US');
        }

        function fmtCotChangeWithClass(n) {
            const v = Number(n);
            if (!Number.isFinite(v)) return { text: '--', cls: 'text-muted' };
            const sign = v > 0 ? '+' : '';
            const cls = v > 0 ? 'text-success' : (v < 0 ? 'text-danger' : 'text-muted');
            return { text: 'Δ ' + sign + v.toLocaleString('en-US'), cls };
        }

        function renderCot(prefix, data) {
            const el = (suffix) => document.getElementById(prefix + suffix);
            const reportDateEl = el('ReportDate');
            const biasEl = el('Bias');
            const ncLong = el('NcLong');
            const ncShort = el('NcShort');
            const ncNet = el('NcNet');
            const ncLongChange = el('NcLongChange');
            const ncShortChange = el('NcShortChange');
            const ncNetChange = el('NcNetChange');
            const ncPctLong = el('NcPctLong');
            const ncPctShort = el('NcPctShort');
            const ncTradersLong = el('NcTradersLong');
            const ncTradersShort = el('NcTradersShort');
            const historyBody = el('NcHistoryBody');
            const footerEl = el('Footer');

            if (!data || data.error) {
                if (reportDateEl) reportDateEl.textContent = '';
                if (biasEl) {
                    biasEl.style.display = 'block';
                    biasEl.className = 'alert alert-danger mb-2 py-2 px-2';
                    biasEl.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>' + ((data && data.error) || 'COT non disponibile');
                }
                if (ncLong) ncLong.textContent = '--';
                if (ncShort) ncShort.textContent = '--';
                if (ncNet) ncNet.textContent = '--';
                if (ncLongChange) ncLongChange.textContent = '--';
                if (ncShortChange) ncShortChange.textContent = '--';
                if (ncNetChange) ncNetChange.textContent = '--';
                if (ncPctLong) ncPctLong.textContent = '--';
                if (ncPctShort) ncPctShort.textContent = '--';
                if (ncTradersLong) ncTradersLong.textContent = '-- traders';
                if (ncTradersShort) ncTradersShort.textContent = '-- traders';
                if (historyBody) historyBody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-2">--</td></tr>';
                if (footerEl) footerEl.textContent = '--';
                return;
            }

            const latest = data.latest || {};
            const nc = latest.non_commercial || {};
            const reportDate = latest.report_date || '--';
            const net = Number(latest.non_commercial_net);
            const netChange = Number(latest.non_commercial_net_change);

            if (reportDateEl) reportDateEl.textContent = '(' + reportDate + ')';

            if (ncLong) ncLong.textContent = fmtCotInt(nc.long);
            if (ncShort) ncShort.textContent = fmtCotInt(nc.short);
            if (ncNet) {
                ncNet.textContent = fmtCotSigned(net);
                ncNet.classList.remove('text-success', 'text-danger', 'text-muted');
                if (Number.isFinite(net)) {
                    ncNet.classList.add(net > 0 ? 'text-success' : (net < 0 ? 'text-danger' : 'text-muted'));
                }
            }

            const longCh = fmtCotChangeWithClass(nc.change_long);
            const shortCh = fmtCotChangeWithClass(nc.change_short);
            const netCh = fmtCotChangeWithClass(netChange);
            if (ncLongChange) {
                ncLongChange.textContent = longCh.text;
                ncLongChange.className = 'box-sub ' + longCh.cls;
            }
            if (ncShortChange) {
                ncShortChange.textContent = shortCh.text;
                ncShortChange.className = 'box-sub ' + shortCh.cls;
            }
            if (ncNetChange) {
                ncNetChange.textContent = netCh.text;
                ncNetChange.className = 'box-sub ' + netCh.cls;
            }

            if (ncPctLong) ncPctLong.textContent = (nc.pct_oi_long != null ? Number(nc.pct_oi_long).toFixed(1) + '%' : '--');
            if (ncPctShort) ncPctShort.textContent = (nc.pct_oi_short != null ? Number(nc.pct_oi_short).toFixed(1) + '%' : '--');
            if (ncTradersLong) ncTradersLong.textContent = (nc.traders_long != null ? nc.traders_long + ' traders' : '-- traders');
            if (ncTradersShort) ncTradersShort.textContent = (nc.traders_short != null ? nc.traders_short + ' traders' : '-- traders');

            // Bias narrative
            if (biasEl) {
                biasEl.style.display = 'block';
                let cls = 'alert-secondary';
                let icon = 'bi-arrows-expand';
                let label = 'Net flat';
                let trend = '';
                if (Number.isFinite(net)) {
                    if (net > 0) {
                        cls = 'alert-success';
                        icon = 'bi-graph-up-arrow';
                        label = 'Net LONG (Bullish bias)';
                    } else if (net < 0) {
                        cls = 'alert-danger';
                        icon = 'bi-graph-down-arrow';
                        label = 'Net SHORT (Bearish bias)';
                    }
                }
                if (Number.isFinite(netChange)) {
                    if (netChange > 0) trend = ' • increasing longs WoW';
                    else if (netChange < 0) trend = ' • increasing shorts WoW';
                }
                biasEl.className = 'alert ' + cls + ' mb-2 py-2 px-2';
                biasEl.innerHTML = '<i class="bi ' + icon + ' me-2"></i><strong>' + label + '</strong>' + trend;
            }

            // History: gli elementi non hanno i campi net → li calcoliamo (long − short).
            if (historyBody) {
                const history = Array.isArray(data.history) ? data.history.slice(0, 6) : [];
                if (!history.length) {
                    historyBody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-2">No history</td></tr>';
                } else {
                    historyBody.innerHTML = history.map((row) => {
                        const r = row || {};
                        const rnc = r.non_commercial || {};
                        const rnet = Number(rnc.long) - Number(rnc.short);
                        const rdelta = Number(rnc.change_long) - Number(rnc.change_short);
                        const netCls = Number.isFinite(rnet) ? (rnet > 0 ? 'text-success' : (rnet < 0 ? 'text-danger' : 'text-muted')) : 'text-muted';
                        const dCls = Number.isFinite(rdelta) ? (rdelta > 0 ? 'text-success' : (rdelta < 0 ? 'text-danger' : 'text-muted')) : 'text-muted';
                        const dStr = Number.isFinite(rdelta) ? ((rdelta > 0 ? '+' : '') + rdelta.toLocaleString('en-US')) : '--';
                        const netStr = Number.isFinite(rnet) ? ((rnet > 0 ? '+' : '') + rnet.toLocaleString('en-US')) : '--';
                        return `<tr>
                            <td>${r.report_date || '--'}</td>
                            <td class="text-end ${netCls}">${netStr}</td>
                            <td class="text-end ${dCls}">${dStr}</td>
                        </tr>`;
                    }).join('');
                }
            }

            // Footer with cache age + source
            if (footerEl) {
                const fetchedAt = data.fetched_at || '';
                const ageSec = Number(data.cache_age_seconds);
                let ageStr = '';
                if (Number.isFinite(ageSec)) {
                    if (ageSec < 60) ageStr = ageSec + 's ago';
                    else if (ageSec < 3600) ageStr = Math.round(ageSec / 60) + 'm ago';
                    else ageStr = Math.round(ageSec / 3600) + 'h ago';
                }
                const fetchedShort = fetchedAt ? String(fetchedAt).replace('T', ' ').slice(0, 16) : '';
                footerEl.textContent = 'Source: CFTC Legacy Futures Only Report' + (fetchedShort ? ' • Fetched ' + fetchedShort : '') + (ageStr ? ' (' + ageStr + ')' : '');
            }
        }

        async function loadCot(contract, opts) {
            const force = !!(opts && opts.force);
            try {
                const url = '/api/cot/' + contract.symbol + (force ? '?force=1' : '');
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                const ctype = (res.headers.get('content-type') || '').toLowerCase();
                if (!ctype.includes('application/json')) {
                    const snippet = (await res.text()).slice(0, 120).replace(/\s+/g, ' ').trim();
                    const reason = res.status === 504 ? 'timeout upstream' : ('HTTP ' + res.status);
                    renderCot(contract.prefix, { error: 'COT non disponibile (' + reason + ')' + (snippet ? ' — ' + snippet : '') });
                    return;
                }
                const data = await res.json();
                renderCot(contract.prefix, data);
            } catch (e) {
                renderCot(contract.prefix, { error: 'Errore di rete: ' + (e && e.message ? e.message : e) });
            }
        }

        function loadAllCot(opts) {
            COT_CONTRACTS.forEach((c) => loadCot(c, opts));
        }

        function startCotPolling() {
            if (cotPollIntervalId) return;
            loadAllCot();
            // COT report is weekly. Poll every 30 min to catch new releases.
            cotPollIntervalId = setInterval(() => loadAllCot(), 30 * 60 * 1000);
        }

        // Build the cards, bind per-card refresh, start polling.
        (function initCotCards() {
            const row = document.getElementById('cotRow');
            if (!row) return;
            row.innerHTML = COT_CONTRACTS.map(cotCardHtml).join('');
            COT_CONTRACTS.forEach((c) => {
                const btn = document.getElementById(c.prefix + 'RefreshBtn');
                if (btn) btn.addEventListener('click', () => loadCot(c, { force: true }));
            });
            startCotPolling();
        })();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (cotPollIntervalId) {
                    clearInterval(cotPollIntervalId);
                    cotPollIntervalId = null;
                }
            } else {
                startCotPolling();
            }
        });
    </script>

    {% include '_release_notes_modal.html' %}
</body>
</html>
